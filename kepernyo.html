<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nyomozós játék – Digitális lábnyom</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/wm.css">
</head>
<body>
  <!-- Keret: a monitor-kép arányát veszi fel, minden % érték ehhez a képhez igazodik -->
  <div id="frame" class="frame">
  <!-- Monitor-kép: mindig látszik, a bekapcsoló gomb ehhez igazodik -->
  <img id="backdrop" class="backdrop" src="assets/szamitogep.png" alt="Számítógép, este 8:30">
  <button id="power-btn" class="power-btn" type="button" aria-label="Monitor bekapcsolása"></button>

  <!-- A kijelző (config.area): ebben váltanak a képernyők -->
  <main id="stage">

    <!-- 1. Kikapcsolt monitor: csak a gép látszik, a gomb a monitor alján van -->
    <section id="screen-off" class="screen active" aria-label="Monitor">
      <p id="off-error" class="off-error" role="alert"></p>
    </section>

    <!-- 2. Bejelentkezés -->
    <section id="screen-login" class="screen" aria-label="Bejelentkezés">
      <div class="login-box">
        <div class="avatar-wrap">
          <img id="avatar" src="assets/nyomozo_fej.png" alt="Nyomozó profilképe">
          <button id="info-btn" class="info-btn" type="button" aria-label="Információ a nyomozóról" aria-expanded="false" aria-controls="info-text">i</button>
        </div>
        <p id="info-text" class="info-text" hidden></p>

        <!-- Nem <form>: a böngésző jelszókezelője így nem ajánl jelszót és nem ugrik fel -->
        <div id="login-form" class="login-form">
          <label for="password">Jelszó</label>
          <input id="password" name="password" type="password"
                 autocomplete="off"
                 data-lpignore="true" data-1p-ignore data-bwignore data-form-type="other">
          <button id="login-btn" type="button">Belépés</button>
        </div>
        <p id="login-error" class="error" role="alert"></p>
      </div>
    </section>

    <!-- 3. Régi stílusú betöltő -->
    <section id="screen-boot" class="screen" aria-label="Betöltés">
      <div class="boot">
        <p class="boot-os">AjtOS</p>
        <pre id="boot-log" class="boot-log"></pre>
        <div class="progress"><div id="progress-bar" class="progress-bar"></div></div>
      </div>
    </section>

    <!-- 4. Asztal tálcával -->
    <section id="screen-desktop" class="screen" aria-label="Asztal">
      <div id="desktop-icons" class="desktop-icons"></div>
      <div id="windows" class="windows"></div>
      <div class="taskbar">
        <button id="start-btn" class="start-btn" type="button">AjtOS</button>
        <div id="taskbar-tasks" class="taskbar-tasks"></div>
        <div class="clock">20:30</div>
      </div>
    </section>

  </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/wm.js"></script>
  <script src="js/mail.js"></script>
  <script src="js/game_logic.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
