<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D monitor – prototípus</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- A Three.js jelenet ide kerül -->
  <div id="stage"></div>

  <!-- A kijelölt képernyő-sík körvonala a képernyőn -->
  <svg id="overlay" aria-hidden="true">
    <polygon id="plane" points=""></polygon>
  </svg>

  <div id="hud">
    <strong>3D monitor – prototípus</strong>
    <p>Húzd az egeret a nézet mozgatásához. Kattints egy tárgyra, hogy megtudd, mi az.</p>
    <p><button id="btn-plane" type="button">Képernyő-sík mutatása</button></p>
    <p id="picked"></p>
    <p id="info"></p>
  </div>

  <!-- Three.js r128 (klasszikus script, file:// alatt is működik, nincs modul) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="monitor-3d.js"></script>
</body>
</html>
