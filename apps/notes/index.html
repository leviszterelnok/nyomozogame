<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes</title>
  <link rel="stylesheet" href="notes.css">
</head>
<body>
  <div class="nt">
    <header class="nt-bar">
      <span id="nt-title" class="nt-title"></span>
      <span id="nt-status" class="nt-status" role="status"></span>
      <button type="button" id="nt-save" class="nt-btn">Mentés</button>
    </header>
    <textarea id="nt-text" class="nt-text" spellcheck="false"></textarea>
  </div>

  <!-- Beállítások (cím, szövegek) a js/data.js-ből -->
  <script src="../../js/data.js"></script>
  <script src="notes.js"></script>
</body>
</html>
